name: One-time safe npm audit remediation
on:
  push:
    branches: [chore/fix-npm-audit]
permissions:
  contents: write
jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[audit-remediation-run]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible npm audit fixes (no force)
        run: npm audit fix --package-lock-only
      - name: Install from updated lockfile
        run: npm ci
      - name: Require no high or critical npm advisories
        run: npm audit --audit-level=high
      - name: Verify application
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run security:scan
          npm run build
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: apply safe npm audit fixes [audit-remediation-run]"
            git push origin HEAD:chore/fix-npm-audit
          fi
