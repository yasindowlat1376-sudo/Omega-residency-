name: omega-residency-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report npm dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/dependency-audit-summary.mjs npm-audit.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run security:scan
      - run: npm run build