name: omega-residency-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report npm dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/dependency-audit-summary.mjs npm-audit.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run security:scan
      - run: npm run build
      - name: Install pinned browser-test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
